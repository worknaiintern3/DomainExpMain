name: DomainExp admin production

on:
  push:
    branches: [main]
    paths:
      - 'apps/admin/**'
      - 'packages/contracts/**'
      - 'tsconfig.base.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-admin.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/admin/**'
      - 'packages/contracts/**'
      - 'tsconfig.base.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:
    inputs:
      deployment_mode:
        description: 'Use setup for the first certificate/domain installation; update thereafter'
        type: choice
        options: [update, setup]
        default: update

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked frontend dependencies
        run: npm ci --workspace=@domainpulse/admin --workspace=@domainpulse/contracts --include-workspace-root --no-audit --no-fund
      - name: Validate deployment and packaging
        run: |
          bash -n apps/admin/deploy/install.sh
          node --test apps/admin/deploy/test/*.test.mjs
      - name: Typecheck and build production frontend
        run: npm run build --workspace=@domainpulse/contracts && npm run build --workspace=@domainpulse/admin
      - name: Package exact revision
        id: package
        run: node apps/admin/deploy/package.mjs
      - name: Smoke-test the packaged Nginx image
        env:
          PACKAGE_DIRECTORY: ${{ steps.package.outputs.directory }}
        run: |
          set -euo pipefail
          docker build -t domainexp-admin-check "$PACKAGE_DIRECTORY"
          docker run --rm domainexp-admin-check nginx -t
          trap 'docker rm -f domainexp-admin-check >/dev/null 2>&1 || true' EXIT
          docker run -d --name domainexp-admin-check -p 127.0.0.1:8089:80 domainexp-admin-check
          ready=0
          for attempt in {1..30}; do
            if [[ "$(docker inspect -f '{{.State.Health.Status}}' domainexp-admin-check)" == healthy ]]; then ready=1; break; fi
            sleep 1
          done
          [[ "$ready" == 1 ]] || { docker logs domainexp-admin-check; exit 1; }
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 1 http://127.0.0.1:8089/ -o /tmp/frontend-login.html
          cmp apps/admin/dist/index.html /tmp/frontend-login.html
          curl --fail --silent --show-error http://127.0.0.1:8089/domains -o /tmp/frontend-route.html
          cmp apps/admin/dist/index.html /tmp/frontend-route.html
          [[ "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8089/assets/missing.js)" == 404 ]]
          [[ "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8089/api/v1/missing)" == 404 ]]
      - uses: actions/upload-artifact@v4
        with:
          name: domainexp-admin-${{ github.sha }}
          path: |
            artifacts/domainexp-admin.tar.gz
            artifacts/domainexp-admin.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: domainexp-admin-production
      cancel-in-progress: false
    env:
      ADMIN_DEPLOY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_mode || 'update' }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: domainexp-admin-${{ github.sha }}
          path: release
      - name: Configure verified SSH access
        shell: bash
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_PORT VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            [[ -n "${!name}" ]] || { echo "Missing secret: $name"; exit 1; }
          done
          [[ "$VPS_HOST" == 200.234.45.233 && "$VPS_USER" == root && "$VPS_PORT" == 22 ]]
          install -d -m 700 ~/.ssh
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/domainexp_admin_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload and deploy the tested artifact
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ADMIN_DEPLOY_MODE" == update || "$ADMIN_DEPLOY_MODE" == setup ]]
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ && "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ && "$GITHUB_RUN_NUMBER" =~ ^[0-9]+$ ]]
          cd release
          sha256sum -c domainexp-admin.tar.gz.sha256
          remote_dir="/opt/domainexp-admin-ci/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh_options=(-i ~/.ssh/domainexp_admin_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          ssh "${ssh_options[@]}" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "umask 077; mkdir -p /opt/domainexp-admin-ci; mkdir '$remote_dir'"
          scp "${ssh_options[@]}" -P "$VPS_PORT" domainexp-admin.tar.gz domainexp-admin.tar.gz.sha256 "$VPS_USER@$VPS_HOST:$remote_dir/"
          ssh "${ssh_options[@]}" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "set -eu; cd '$remote_dir'; sha256sum -c domainexp-admin.tar.gz.sha256; tar -xzf domainexp-admin.tar.gz; ADMIN_DEPLOY_MODE='$ADMIN_DEPLOY_MODE' ADMIN_RELEASE_SHA='$GITHUB_SHA' ADMIN_RELEASE_NUMBER='$GITHUB_RUN_NUMBER' bash install.sh"
      - name: Clean up private key
        if: always()
        run: rm -f ~/.ssh/domainexp_admin_key
