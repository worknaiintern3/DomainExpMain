services:
  postgres:
    image: postgres:16-alpine
    container_name: domainpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: domainpulse_app
      POSTGRES_PASSWORD: Admin@1234
      POSTGRES_DB: domainpulse_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
