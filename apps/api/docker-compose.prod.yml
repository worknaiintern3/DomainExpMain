name: domainexp_app

x-runtime: &runtime
  image: ${API_IMAGE:-domainexp_app_api:local}
  build:
    context: ../..
    dockerfile: apps/api/Dockerfile
  env_file: deploy/.env.runtime
  environment:
    NODE_ENV: production
    API_HOST: 0.0.0.0
    API_PORT: 4000
    API_TRUST_PROXY_HOPS: 1
  networks: [domainexp_app_proxy]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  read_only: true
  tmpfs: [/tmp]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}

services:
  backend:
    <<: *runtime
    container_name: domainexp_app_backend
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    # Local probes only. Central Nginx reaches the dedicated Docker network.
    ports: ['127.0.0.1:${BACKEND_HOST_PORT:?Choose a free VPS port}:4000']
  migrate:
    <<: *runtime
    env_file: deploy/.env
    profiles: [maintenance]
    command: [node, deploy/migrate.cjs]
    restart: 'no'
    healthcheck: {disable: true}

networks:
  domainexp_app_proxy:
    name: domainexp_app_proxy
