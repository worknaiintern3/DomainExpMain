# Managed exclusively by DomainExp's one-time install-nginx.sh.
server {
    listen 80;
    listen [::]:80;
    server_name app.domainexp.info;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.domainexp.info;
    ssl_certificate /etc/letsencrypt/live/app.domainexp.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.domainexp.info/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    add_header X-Domainexp-Backend domainexp_app_backend always;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 1m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $domainexp_upstream http://domainexp_app_backend:4000;
    location / {
        proxy_pass $domainexp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
