# Managed exclusively by DomainExp web frontend deployment.
# Install in the existing central Nginx conf.d directory after SSL setup.
server {
    listen 80;
    listen [::]:80;
    server_name domainexprt.com www.domainexprt.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://domainexprt.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.domainexprt.com;
    ssl_certificate /etc/letsencrypt/live/domainexprt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/domainexprt.com/privkey.pem;
    return 301 https://domainexprt.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name domainexprt.com;
    ssl_certificate /etc/letsencrypt/live/domainexprt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/domainexprt.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Domainexp-Frontend domainexp_web_frontend always;
    client_max_body_size 1m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $web_upstream http://domainexp_web_frontend:80;
    set $api_upstream http://domainexp_app_backend:4000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    # Preserve the complete /api/v1/... path and use same-origin browser requests.
    location /api/ { proxy_pass $api_upstream; }
    location / { proxy_pass $web_upstream; }
}
