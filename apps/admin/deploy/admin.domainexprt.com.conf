# Managed exclusively by DomainExp admin frontend deployment.
server {
    listen 80;
    listen [::]:80;
    server_name admin.domainexprt.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://admin.domainexprt.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.domainexprt.com;
    ssl_certificate /etc/letsencrypt/live/admin.domainexprt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.domainexprt.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Domainexp-Frontend domainexp_admin_frontend always;
    client_max_body_size 1m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $admin_upstream http://domainexp_admin_frontend:80;
    set $api_upstream http://domainexp_app_backend:4000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    location /api/ { proxy_pass $api_upstream; }
    location / { proxy_pass $admin_upstream; }
}
