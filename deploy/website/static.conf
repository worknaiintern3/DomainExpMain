server {
    listen 80;
    server_name _;

    root /usr/share/nginx/landing;
    index index.html;

    location = / { try_files /index.html =404; }
    location ^~ /_next/ { try_files $uri =404; }
    location = /favicon.ico { try_files $uri =404; }
    location = /logo.svg { try_files $uri =404; }
    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }

    location ^~ /assets/ {
        root /usr/share/nginx/web;
        try_files $uri =404;
    }
    location = /logo.png {
        root /usr/share/nginx/web;
        try_files $uri =404;
    }
    location = /favicon.png {
        root /usr/share/nginx/web;
        try_files $uri =404;
    }
    location = /push-sw.js {
        root /usr/share/nginx/web;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/web;
        try_files $uri /index.html;
    }
}
